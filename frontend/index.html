<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criminal Network Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-gray-100 text-gray-900">
    <header class="bg-gray-900 p-4 text-white">
        <h1 class="text-xl font-bold">Criminal Network Analysis System</h1>
    </header>

    <nav class="bg-white p-3 shadow">
        <div class="mx-auto flex max-w-5xl gap-3">
            <button class="nav-button rounded bg-red-700 px-3 py-2 text-white" data-page="suspects">
                Suspects
            </button>
            <button class="nav-button rounded px-3 py-2" data-page="crimes">
                Crimes
            </button>
            <button class="nav-button rounded px-3 py-2" data-page="relationships">
                Relationships
            </button>
            <button class="nav-button rounded px-3 py-2" data-page="network">
                Network
            </button>
        </div>
    </nav>

    <main class="mx-auto max-w-5xl p-6">
        <section id="suspects-page" class="page">
            <div class="mb-4 flex items-center justify-between">
                <h2 class="text-2xl font-semibold">Suspects</h2>
                <button id="show-suspect-form" class="rounded bg-red-700 px-4 py-2 text-white">
                    Add suspect
                </button>
            </div>

            <form id="suspect-form" class="mb-6 hidden rounded bg-white p-4 shadow">
                <h3 class="mb-4 text-lg font-semibold">New suspect</h3>

                <div class="grid gap-4 md:grid-cols-3">
                    <div>
                        <label for="suspect-name" class="mb-1 block">Name</label>
                        <input id="suspect-name" type="text" required
                               class="w-full rounded border p-2">
                    </div>

                    <div>
                        <label for="suspect-dob" class="mb-1 block">Date of birth</label>
                        <input id="suspect-dob" type="date" required
                               class="w-full rounded border p-2">
                    </div>

                    <div>
                        <label for="suspect-risk" class="mb-1 block">Risk level</label>
                        <input id="suspect-risk" type="number" min="1" max="5" required
                               class="w-full rounded border p-2">
                    </div>
                </div>

                <div class="mt-4 flex gap-2">
                    <button type="submit" class="rounded bg-red-700 px-4 py-2 text-white">
                        Save
                    </button>
                    <button id="cancel-suspect-form" type="button"
                            class="rounded bg-gray-300 px-4 py-2">
                        Cancel
                    </button>
                </div>
            </form>

            <div class="overflow-x-auto rounded bg-white shadow">
                <table class="w-full text-left">
                    <thead class="bg-gray-800 text-white">
                        <tr>
                            <th class="p-3">ID</th>
                            <th class="p-3">Name</th>
                            <th class="p-3">Date of birth</th>
                            <th class="p-3">Risk</th>
                            <th class="p-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="suspect-table">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-gray-500">
                                No suspects added yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section id="crimes-page" class="page hidden">
            <h2 class="text-2xl font-semibold">Crimes</h2>
            <p class="mt-2 text-gray-600">Crime records will be shown here.</p>
        </section>

        <section id="relationships-page" class="page hidden">
            <h2 class="text-2xl font-semibold">Relationships</h2>
            <p class="mt-2 text-gray-600">Relationships will be managed here.</p>
        </section>

        <section id="network-page" class="page hidden">
            <h2 class="text-2xl font-semibold">Network</h2>
            <p class="mt-2 text-gray-600">The network graph will be shown here.</p>
        </section>
    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
